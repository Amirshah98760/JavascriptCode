<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreelanceHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>FreelanceHub</h1>
  <nav>
    <a href="#">Explore</a>
    <a href="#" id="addGigBtn">Post a Gig</a>
  </nav>
</header>

<div class="container">
  <div class="controls">
    <input type="text" id="search" placeholder="Search services..." />
    <select id="category">
      <option value="">All Categories</option>
      <option value="design">Design</option>
      <option value="development">Development</option>
      <option value="writing">Writing</option>
    </select>
  </div>

  <div class="grid" id="gigGrid"></div>
</div>

<!-- Modal -->
<div class="modal" id="gigModal">
  <div class="modal-content">
    <h2>Post a New Gig</h2>
    <input type="text" id="gigTitle" placeholder="Gig title" />
    <textarea id="gigDesc" placeholder="Description"></textarea>
    <input type="number" id="gigPrice" placeholder="Price ($)" />
    <select id="gigCategory" class="modalDropdown">
      <option value="design">Design</option>
      <option value="development">Development</option>
      <option value="writing">Writing</option>
    </select>
    <button onclick="saveGig()" class="modalBtn">Save</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
